name: deploy

# Runs only after the ci workflow succeeds, on the commit ci tested.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    # Never run fork code with the repository secrets.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVENT: ${{ github.event.workflow_run.event }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Skip without Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; the build ran but nothing was deployed."
      - name: Deploy main
        if: env.CLOUDFLARE_API_TOKEN != '' && env.EVENT == 'push' && env.BRANCH == 'main'
        run: npx wrangler deploy
      - name: Upload a preview version
        if: env.CLOUDFLARE_API_TOKEN != '' && env.EVENT == 'pull_request' && env.PR != ''
        run: |
          npx wrangler versions upload --preview-alias "pr-$PR" | tee upload.log
          grep -Eo 'https://[^ ]+\.workers\.dev' upload.log | sed 's/^/Preview: /' >> "$GITHUB_STEP_SUMMARY" || true
